<svg width="192" height="192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="96" cy="96" r="88" fill="url(#iconGradient)" stroke="#ffffff" stroke-width="4"/>
  
  <!-- 全息投影效果 -->
  <g transform="translate(96,96)">
    <!-- 中心核心 -->
    <circle cx="0" cy="0" r="20" fill="#ffffff" opacity="0.9"/>
    
    <!-- 环形轨道 -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
    
    <!-- 数据节点 -->
    <circle cx="25" cy="-25" r="4" fill="#ffffff"/>
    <circle cx="-30" cy="20" r="4" fill="#ffffff"/>
    <circle cx="35" cy="30" r="4" fill="#ffffff"/>
    <circle cx="-25" cy="-35" r="4" fill="#ffffff"/>
    
    <!-- 连接线 -->
    <line x1="0" y1="0" x2="25" y2="-25" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    <line x1="0" y1="0" x2="-30" y2="20" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    <line x1="0" y1="0" x2="35" y2="30" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    <line x1="0" y1="0" x2="-25" y2="-35" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    
    <!-- AI神经网络图案 -->
    <path d="M-15,-10 Q0,-20 15,-10 Q0,0 -15,-10" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    <path d="M-10,15 Q0,5 10,15 Q0,25 -10,15" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  </g>
  
  <!-- 文字标识 -->
  <text x="96" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">HIEC</text>
</svg>