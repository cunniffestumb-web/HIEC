<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#533483;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowEffect" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#0080ff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#000080;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景渐变 -->
  <rect width="100%" height="100%" fill="url(#heroGradient)"/>
  
  <!-- 发光效果 -->
  <circle cx="960" cy="540" r="400" fill="url(#glowEffect)" opacity="0.6"/>
  
  <!-- 科技网格 -->
  <g stroke="#00ffff" stroke-width="0.5" opacity="0.2" fill="none">
    <defs>
      <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
        <path d="M 50 0 L 0 0 0 50" stroke="#00ffff" stroke-width="0.5" opacity="0.3"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#grid)"/>
  </g>
  
  <!-- 浮动粒子 -->
  <g opacity="0.7">
    <circle cx="200" cy="200" r="2" fill="#00ffff" filter="url(#glow)">
      <animate attributeName="cy" values="200;180;200" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="300" r="1.5" fill="#0080ff" filter="url(#glow)">
      <animate attributeName="cy" values="300;320;300" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="150" r="2.5" fill="#00ffff" filter="url(#glow)">
      <animate attributeName="cy" values="150;130;150" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="800" cy="400" r="1" fill="#0080ff" filter="url(#glow)">
      <animate attributeName="cy" values="400;420;400" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="250" r="2" fill="#00ffff" filter="url(#glow)">
      <animate attributeName="cy" values="250;230;250" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1200" cy="350" r="1.5" fill="#0080ff" filter="url(#glow)">
      <animate attributeName="cy" values="350;370;350" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1400" cy="180" r="2.5" fill="#00ffff" filter="url(#glow)">
      <animate attributeName="cy" values="180;160;180" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1600" cy="320" r="1" fill="#0080ff" filter="url(#glow)">
      <animate attributeName="cy" values="320;340;320" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 全息投影线条 -->
  <g stroke="#00ffff" stroke-width="1" opacity="0.4" fill="none">
    <path d="M 100 100 Q 500 200 900 100 T 1700 150" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.4;0.8;0.4" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M 200 300 Q 600 400 1000 300 T 1800 350" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 150 500 Q 550 600 950 500 T 1750 550" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>