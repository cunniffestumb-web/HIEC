        .control-panel {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(0,212,255,0.2);
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .control-panel:hover {
            border-color: rgba(0,212,255,0.4);
            box-shadow: 0 15px 50px rgba(0,212,255,0.1);
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .panel-title {
            color: #00d4ff;
            font-size: 1.1rem;
            font-weight: 600;
        }
        
        .panel-collapse {
            background: none;
            border: none;
            color: #00d4ff;
            cursor: pointer;
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }
        
        .panel-collapse:hover {
            transform: scale(1.1);
        }
        
        .panel-content {
            transition: all 0.3s ease;
            overflow: hidden;
        }
        
        .panel-content.collapsed {
            max-height: 0;
            opacity: 0;
            padding: 0;
        }
        
        .system-toggle {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            margin: 8px 0;
            padding: 15px 20px;
            background: linear-gradient(45deg, rgba(0,212,255,0.1), rgba(139,92,246,0.1));
            color: white;
            border: 1px solid rgba(0,212,255,0.3);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }
        
        .system-toggle::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s ease;
        }
        
        .system-toggle:hover::before {
            left: 100%;
        }
        
        .system-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,212,255,0.3);
            border-color: rgba(0,212,255,0.5);
        }
        
        .system-toggle.active {
            background: linear-gradient(45deg, rgba(6,255,165,0.2), rgba(0,212,255,0.2));
            border-color: rgba(6,255,165,0.6);
            box-shadow: 0 0 25px rgba(6,255,165,0.3);
        }
        
        .system-toggle span {
            margin-right: 12px;
            font-size: 1.1rem;
        }
        
        .control-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .info-panel {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(0,212,255,0.2);
            max-width: 350px;
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        
        .info-panel:hover {
            border-color: rgba(0,212,255,0.4);
            box-shadow: 0 15px 50px rgba(0,212,255,0.1);
        }
        
        .info-title {
            color: #00d4ff;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }
        
        .info-title span {
            margin-right: 10px;
            font-size: 1.2rem;
        }
        
        .info-content {
            color: rgba(255,255,255,0.9);
            line-height: 1.7;
            font-size: 0.95rem;
        }
        
        .interactive-hotspot {
            position: absolute;
            width: 24px;
            height: 24px;
            background: radial-gradient(circle, rgba(0,212,255,0.8), rgba(0,212,255,0.2));
            border: 2px solid rgba(0,212,255,0.6);
            border-radius: 50%;
            cursor: pointer;
            animation: pulse 2.5s infinite;
            transition: all 0.3s ease;
            z-index: 10;
        }
        
        .interactive-hotspot::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border: 2px solid rgba(0,212,255,0.3);
            border-radius: 50%;
            animation: ripple 2.5s infinite;
        }
        
        .interactive-hotspot:hover {
            transform: scale(1.3);
            background: radial-gradient(circle, rgba(6,255,165,0.9), rgba(6,255,165,0.3));
            border-color: rgba(6,255,165,0.8);
            box-shadow: 0 0 20px rgba(6,255,165,0.5);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }
        
        @keyframes ripple {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
        
        .heart-hotspot { top: 30%; left: 45%; }
        .brain-hotspot { top: 10%; left: 50%; }
        .lung-hotspot { top: 35%; left: 35%; }
        .liver-hotspot { top: 45%; left: 55%; }
        
        /* 键盘控制提示样式 - 已移除 */
        
        /* 加载动画 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        .loading-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(0,212,255,0.3);
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .control-panel {
                right: 10px;
                padding: 15px;
                max-width: 200px;
            }
            
            .info-panel {
                left: 10px;
                max-width: 250px;
                padding: 15px;
            }
            
            .human-model {
                width: 300px;
                height: 450px;
            }
            
            .keyboard-hints {
                display: none;
            }
        }
    </style>

                <button class="system-toggle active" data-system="skeletal">
                    <span>🦴</span>
                    骨骼系统
                </button>
                <button class="system-toggle" data-system="muscular">
                    <span>💪</span>
                    肌肉系统
                </button>
                <button class="system-toggle" data-system="circulatory">
                    <span>❤️</span>
                    循环系统
                </button>
                <button class="system-toggle" data-system="nervous">
                    <span>🧠</span>
                    神经系统
                </button>
            </div>
            
            <div class="control-section">
                <h4 style="color: #00d4ff; margin-bottom: 15px;">
                    <span>🛠️</span>
                    操作控制
                </h4>

            </div>
        </div>
    </div>

    <!-- 信息面板 -->
    <div class="info-panel" id="infoPanel">
        <div class="info-title">
            <span>ℹ️</span>
            器官信息
        </div>
        <div class="info-content" id="infoContent">
            <p>点击人体模型上的热点来了解不同器官的详细信息。</p>
            <p>使用右侧控制面板切换不同的身体系统。</p>
        </div>
    </div>



    <!-- 加载遮罩 -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- JavaScript交互功能 -->
    <script>
        // 器官信息数据
        const organInfo = {
            brain: {
                title: "大脑",
                content: "大脑是人体最复杂的器官，重约1.4公斤，含有约860亿个神经元。它是思维、记忆、情感和意识的中心，控制着身体的各种生理功能。大脑分为大脑皮层、小脑和脑干三个主要部分，每个部分都有特定的功能。大脑消耗人体约20%的能量，虽然只占体重的2%。"
            },
            heart: {
                title: "心脏",
                content: "心脏是循环系统的核心，是一个强有力的肌肉泵。成人心脏重约300-400克，每天跳动约10万次，一生中跳动约25-30亿次。心脏有四个腔室：左右心房和左右心室，通过有序的收缩和舒张，将血液泵送到全身，每分钟泵送约5升血液。"
            },
            lungs: {
                title: "肺部",
                content: "肺部是呼吸系统的主要器官，位于胸腔内，由左右两叶组成。肺部含有约3亿个微小的气囊（肺泡），总表面积约70平方米。肺部负责气体交换，将吸入的氧气输送到血液中，同时将血液中的二氧化碳排出体外。成人每天呼吸约2万次。"
            },
            liver: {
                title: "肝脏",
                content: "肝脏是人体最大的内脏器官，重约1.5公斤，具有500多种生理功能。主要功能包括：解毒、蛋白质合成、胆汁生产、糖原储存、脂肪代谢和维生素储存。肝脏具有强大的再生能力，即使切除75%的肝组织，也能在几个月内完全恢复。"
            }
        };

        // 全局变量
        let currentSystem = 'skeletal';
        let panelCollapsed = false;

        // DOM元素
        const humanModel = document.getElementById('humanModel');
        const infoContent = document.getElementById('infoContent');
        const systemToggles = document.querySelectorAll('.system-toggle[data-system]');
        const hotspots = document.querySelectorAll('.interactive-hotspot');

        const panelCollapseBtn = document.getElementById('panelCollapse');
        const panelContent = document.getElementById('panelContent');
        const loadingOverlay = document.getElementById('loadingOverlay');

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            initializeEventListeners();
            showLoadingAnimation();
            setTimeout(() => {
                hideLoadingAnimation();
                updateInfoPanel('欢迎使用人体解剖学教学系统！<br><br>这是一个交互式的3D人体解剖学习平台，帮助您深入了解人体的各个系统和器官。<br><br>• 使用右侧控制面板切换不同的身体系统<br>• 点击人体模型上的热点区域了解器官详情<br>• 左侧信息面板将显示详细的解剖学知识<br><br>开始您的人体探索之旅吧！');
            }, 1500);
        });

        // 初始化事件监听器
        function initializeEventListeners() {
            // 系统切换按钮事件
            systemToggles.forEach(button => {
                button.addEventListener('click', function() {
                    const system = this.getAttribute('data-system');
                    switchSystem(system);
                });
            });

            // 热点点击事件
            hotspots.forEach(hotspot => {
                hotspot.addEventListener('click', function() {
                    const organ = this.getAttribute('data-organ');
                    showOrganInfo(organ);
                    
                    // 添加点击效果
                    this.style.transform = 'scale(1.5)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 200);
                });
            });


            panelCollapseBtn.addEventListener('click', togglePanel);



            // 鼠标悬停效果
            humanModel.addEventListener('mouseenter', function() {
                this.style.cursor = 'pointer';
            });

            humanModel.addEventListener('mouseleave', function() {
                this.style.cursor = 'default';
            });
        }

        // 切换身体系统
        function switchSystem(system) {
            showLoadingAnimation();
            
            setTimeout(() => {
                // 隐藏所有系统
                document.querySelectorAll('.body-system').forEach(sys => {
                    sys.style.display = 'none';
                });
                
                // 显示选中的系统
                document.getElementById(system).style.display = 'block';
                
                // 更新按钮状态
                systemToggles.forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelector(`[data-system="${system}"]`).classList.add('active');
                
                currentSystem = system;
                updateSystemInfo(system);
                
                // 切换3D模型系统 (已禁用，使用2D SVG模式)
                // switch3DSystem(system);
                
                hideLoadingAnimation();
            }, 500);
        }

        // 更新系统信息
        function updateSystemInfo(system) {
            const systemInfo = {
                skeletal: {
                    title: "骨骼系统",
                    content: "人体骨骼系统由206块骨头组成，是身体的支撑框架。骨骼不仅为身体提供结构支撑和形状，还保护重要的内脏器官免受外界伤害。此外，骨骼系统还是造血的重要场所，骨髓负责产生红细胞、白细胞和血小板。骨骼还储存着人体99%的钙和85%的磷，是重要的矿物质储存库。"
                },
                muscular: {
                    title: "肌肉系统", 
                    content: "人体肌肉系统包含超过600块肌肉，约占成人体重的40-50%。肌肉系统负责身体的各种运动，从精细的面部表情到强有力的四肢运动。肌肉还维持身体姿势，产生热量以维持体温，并协助血液循环。肌肉组织具有收缩性、兴奋性、伸展性和弹性等特性。"
                },
                circulatory: {
                    title: "循环系统",
                    content: "循环系统包括心脏、血管和血液，是人体的运输系统。心脏作为动力泵，每天跳动约10万次，推动血液在全身循环。血管网络总长度约10万公里，负责将氧气、营养物质、激素和免疫细胞输送到全身各处，同时清除代谢废物和二氧化碳。"
                },
                nervous: {
                    title: "神经系统",
                    content: "神经系统是人体的控制和通信网络，包括中枢神经系统（大脑和脊髓）和周围神经系统。大脑含有约860亿个神经元，负责思维、记忆、情感和意识。神经系统控制和协调身体的所有活动，处理感觉信息，产生适当的反应，并维持身体的内环境稳定。"
                }
            };
            
            updateInfoPanel(`<strong>${systemInfo[system].title}</strong><br><br>${systemInfo[system].content}`);
        }

        // 显示器官信息
        function showOrganInfo(organ) {
            const info = organInfo[organ];
            if (info) {
                updateInfoPanel(`<strong>${info.title}</strong><br><br>${info.content}`);
            }
        }

        // 更新信息面板
        function updateInfoPanel(content) {
            infoContent.innerHTML = content;
            
            // 添加更新动画
            infoContent.style.opacity = '0';
            setTimeout(() => {
                infoContent.style.opacity = '1';
            }, 100);
        }

        // 切换面板折叠
        function togglePanel() {
            panelCollapsed = !panelCollapsed;
            
            if (panelCollapsed) {
                panelContent.classList.add('collapsed');
                panelCollapseBtn.innerHTML = '<span>🔽</span>';
            } else {
                panelContent.classList.remove('collapsed');
                panelCollapseBtn.innerHTML = '<span>🔼</span>';
            }
        }



        // 显示加载动画
        function showLoadingAnimation() {
            loadingOverlay.classList.add('active');
        }

        // 隐藏加载动画
        function hideLoadingAnimation() {
            loadingOverlay.classList.remove('active');
        }

        // 添加粒子效果（可选）
        function createParticleEffect() {
            const particles = [];
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.cssText = `
                    position: absolute;
                    width: 2px;
                    height: 2px;
                    background: rgba(0,212,255,0.6);
                    border-radius: 50%;
                    pointer-events: none;
                    animation: float ${Math.random() * 3 + 2}s ease-in-out infinite;
                `;
                
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 2 + 's';
                
                document.querySelector('.anatomy-3d-container').appendChild(particle);
            }
        }

        // 可选：启用粒子效果
        // createParticleEffect();

        // Three.js 3D模型初始化
        let scene, camera, renderer, controls;
        let currentModel = null;
        let models = {};

        function init3D() {
            const container = document.getElementById('threejs-container');
            
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            
            // 创建相机
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 5);
            
            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);
            
            // 添加控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = true;
            controls.enablePan = true;
            
            // 添加光源
            const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            const pointLight = new THREE.PointLight(0x00d4ff, 0.5, 100);
            pointLight.position.set(-10, -10, -10);
            scene.add(pointLight);
            
            // 加载3D模型
            load3DModels();
            
            // 开始渲染循环
            animate();
            
            // 窗口大小调整
            window.addEventListener('resize', onWindowResize, false);
        }

        function load3DModels() {
            const loader = new THREE.GLTFLoader();
            
            // 加载人体模型
            loader.load('./human_model.glb', function(gltf) {
                models.human = gltf.scene;
                models.human.scale.set(2, 2, 2);
                models.human.position.set(0, -1, 0);
                scene.add(models.human);
                currentModel = models.human;
                console.log('人体模型加载成功');
            }, function(progress) {
                console.log('加载进度:', (progress.loaded / progress.total * 100) + '%');
            }, function(error) {
                console.error('模型加载失败:', error);
                // 如果模型加载失败，创建一个简单的几何体作为占位符
                createFallbackModel();
            });
            
            // 加载大脑模型
            loader.load('./brain_model.glb', function(gltf) {
                models.brain = gltf.scene;
                models.brain.scale.set(1, 1, 1);
                models.brain.position.set(0, 0, 0);
                models.brain.visible = false;
                scene.add(models.brain);
                console.log('大脑模型加载成功');
            }, undefined, function(error) {
                console.error('大脑模型加载失败:', error);
            });
        }

        function createFallbackModel() {
            // 创建一个简单的人体形状作为占位符
            const group = new THREE.Group();
            
            // 头部
            const headGeometry = new THREE.SphereGeometry(0.3, 32, 32);
            const headMaterial = new THREE.MeshPhongMaterial({ color: 0xfdbcb4 });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.set(0, 1.5, 0);
            group.add(head);
            
            // 身体
            const bodyGeometry = new THREE.CylinderGeometry(0.3, 0.4, 1.2, 8);
            const bodyMaterial = new THREE.MeshPhongMaterial({ color: 0x4a90e2 });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.position.set(0, 0.3, 0);
            group.add(body);
            
            // 手臂
            const armGeometry = new THREE.CylinderGeometry(0.1, 0.1, 0.8, 8);
            const armMaterial = new THREE.MeshPhongMaterial({ color: 0xfdbcb4 });
            
            const leftArm = new THREE.Mesh(armGeometry, armMaterial);
            leftArm.position.set(-0.6, 0.5, 0);
            leftArm.rotation.z = Math.PI / 6;
            group.add(leftArm);
            
            const rightArm = new THREE.Mesh(armGeometry, armMaterial);
            rightArm.position.set(0.6, 0.5, 0);
            rightArm.rotation.z = -Math.PI / 6;
            group.add(rightArm);
            
            // 腿部
            const legGeometry = new THREE.CylinderGeometry(0.12, 0.12, 1, 8);
            const legMaterial = new THREE.MeshPhongMaterial({ color: 0x4a90e2 });
            
            const leftLeg = new THREE.Mesh(legGeometry, legMaterial);
            leftLeg.position.set(-0.2, -0.8, 0);
            group.add(leftLeg);
            
            const rightLeg = new THREE.Mesh(legGeometry, legMaterial);
            rightLeg.position.set(0.2, -0.8, 0);
            group.add(rightLeg);
            
            group.position.set(0, 0, 0);
            scene.add(group);
            currentModel = group;
            models.fallback = group;
            
            console.log('使用备用模型');
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (controls) {
                controls.update();
            }
            
            // 旋转模型
            if (currentModel) {
                currentModel.rotation.y += 0.005;
            }
            
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 切换3D模型系统
        function switch3DSystem(system) {
            if (!currentModel) return;
            
            // 根据系统改变模型材质或显示不同模型
            switch(system) {
                case 'skeletal':
                    // 骨骼系统 - 白色材质
                    updateModelMaterial(0xf0f0f0);
                    break;
                case 'muscular':
                    // 肌肉系统 - 红色材质
                    updateModelMaterial(0xff4444);
                    break;
                case 'circulatory':
                    // 循环系统 - 红色脉络
                    updateModelMaterial(0xff0000);
                    break;
                case 'nervous':
                    // 神经系统 - 黄色
                    updateModelMaterial(0xffff00);
                    break;
            }
        }

        function updateModelMaterial(color) {
            if (!currentModel) return;
            
            currentModel.traverse(function(child) {
                if (child.isMesh) {
                    child.material = new THREE.MeshPhongMaterial({ 
                        color: color,
                        transparent: true,
                        opacity: 0.8
                    });
                }
            });
        }

        // 页面加载完成后初始化3D场景
        window.addEventListener('load', function() {
            // 禁用3D初始化，使用SVG交互模式
            // init3D();
            console.log('Anatomy demo initialized in 2D SVG mode');
        });
    </script>

    <!-- 引入主脚本 -->
    <script src="script.js"></script>
</body>
</html>
