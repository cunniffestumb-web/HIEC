<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音交流 - 全息智能教育云</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <style>
        .voice-container {
            display: flex;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        
        .room-header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            color: white;
        }
        
        .room-title {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .room-info {
            display: flex;
            gap: 20px;
            font-size: 14px;
            opacity: 0.8;
        }
        
        .participants-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .participant-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            color: white;
            position: relative;
            transition: transform 0.3s ease;
        }
        
        .participant-card:hover {
            transform: translateY(-5px);
        }
        
        .participant-card.speaking {
            box-shadow: 0 0 20px rgba(52, 152, 219, 0.6);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(52, 152, 219, 0.6); }
            50% { box-shadow: 0 0 30px rgba(52, 152, 219, 0.8); }
            100% { box-shadow: 0 0 20px rgba(52, 152, 219, 0.6); }
        }
        
        .participant-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(45deg, #3498db, #2ecc71);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 15px;
            position: relative;
        }
        
        .mic-status {
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        .mic-on {
            background: #2ecc71;
            color: white;
        }
        
        .mic-off {
            background: #e74c3c;
            color: white;
        }
        
        .participant-name {
            font-size: 16px;
            margin-bottom: 5px;
        }
        
        .participant-role {
            font-size: 12px;
            opacity: 0.7;
        }
        
        .controls {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s ease;
            color: white;
        }
        
        .mic-btn {
            background: #2ecc71;
        }
        
        .mic-btn.muted {
            background: #e74c3c;
        }
        
        .speaker-btn {
            background: #3498db;
        }
        
        .speaker-btn.muted {
            background: #95a5a6;
        }
        
        .leave-btn {
            background: #e74c3c;
        }
        
        .control-btn:hover {
            transform: scale(1.1);
        }
        
        .sidebar {
            width: 300px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            color: white;
        }
        
        .chat-area {
            height: 60%;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            overflow-y: auto;
        }
        
        .chat-message {
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }
        
        .message-sender {
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 5px;
        }
        
        .chat-input {
            display: flex;
            gap: 10px;
        }
        
        .chat-input input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .chat-input input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .send-btn {
            padding: 10px 15px;
            background: #3498db;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            html,
            body {
                overflow-x: hidden;
            }

            .voice-container {
                display: block;
                height: auto;
                min-height: 100dvh;
                overflow-y: auto;
            }

            .main-area {
                width: 100%;
                min-width: 0;
                padding: 12px;
            }

            .room-header {
                padding: 14px;
                margin-bottom: 12px;
            }

            .room-title { font-size: 20px; }
            .room-info { flex-wrap: wrap; gap: 8px 14px; font-size: 13px; }
            .participants-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                margin-bottom: 12px;
            }

            .participant-card { padding: 14px 8px; border-radius: 12px; }
            .participant-avatar { width: 58px; height: 58px; font-size: 24px; margin-bottom: 8px; }
            .participant-name { font-size: 14px; }
            .controls { padding: 12px; gap: 10px; }
            .control-btn { width: 52px; height: 52px; font-size: 18px; }

            .sidebar {
                width: 100%;
                min-width: 0;
                padding: 14px;
            }

            .chat-area { height: 260px; margin-bottom: 12px; }
        }
    </style>
</head>
<body>
    <div class="voice-container">
        <div class="main-area">
            <!-- 房间信息 -->
            <div class="room-header">
                <div class="room-title">生物课堂语音讨论</div>
                <div class="room-info">
                    <span><i class="fas fa-users"></i> 6人在线</span>
                    <span><i class="fas fa-clock"></i> 进行中 25:30</span>
                    <span><i class="fas fa-microphone"></i> 4人发言</span>
                </div>
            </div>
            
            <!-- 参与者网格 -->
            <div class="participants-grid">
                <div class="participant-card speaking">
                    <div class="participant-avatar">
                        张
                        <div class="mic-status mic-on">
                            <i class="fas fa-microphone"></i>
                        </div>
                    </div>
                    <div class="participant-name">张老师</div>
                    <div class="participant-role">主讲人</div>
                </div>
                
                <div class="participant-card">
                    <div class="participant-avatar">
                        李
                        <div class="mic-status mic-on">
                            <i class="fas fa-microphone"></i>
                        </div>
                    </div>
                    <div class="participant-name">李同学</div>
                    <div class="participant-role">学生</div>
                </div>
                
                <div class="participant-card">
                    <div class="participant-avatar">
                        王
                        <div class="mic-status mic-off">
                            <i class="fas fa-microphone-slash"></i>
                        </div>
                    </div>
                    <div class="participant-name">王同学</div>
                    <div class="participant-role">学生</div>
                </div>
                
                <div class="participant-card">
                    <div class="participant-avatar">
                        赵
                        <div class="mic-status mic-on">
                            <i class="fas fa-microphone"></i>
                        </div>
                    </div>
                    <div class="participant-name">赵同学</div>
                    <div class="participant-role">学生</div>
                </div>
                
                <div class="participant-card">
                    <div class="participant-avatar">
                        刘
                        <div class="mic-status mic-off">
                            <i class="fas fa-microphone-slash"></i>
                        </div>
                    </div>
                    <div class="participant-name">刘同学</div>
                    <div class="participant-role">学生</div>
                </div>
                
                <div class="participant-card">
                    <div class="participant-avatar">
                        陈
                        <div class="mic-status mic-on">
                            <i class="fas fa-microphone"></i>
                        </div>
                    </div>
                    <div class="participant-name">陈同学</div>
                    <div class="participant-role">学生</div>
                </div>
            </div>
            
            <!-- 控制按钮 -->
            <div class="controls">
                <button class="control-btn mic-btn" id="micBtn" title="麦克风">
                    <i class="fas fa-microphone"></i>
                </button>
                <button class="control-btn speaker-btn" id="speakerBtn" title="扬声器">
                    <i class="fas fa-volume-up"></i>
                </button>
                <button class="control-btn" style="background: #f39c12;" title="举手">
                    <i class="fas fa-hand-paper"></i>
                </button>
                <button class="control-btn" style="background: #9b59b6;" title="设置">
                    <i class="fas fa-cog"></i>
                </button>
                <button class="control-btn leave-btn" title="离开房间" onclick="window.history.back()">
                    <i class="fas fa-phone-slash"></i>
                </button>
            </div>
        </div>
        
        <!-- 侧边栏 -->
        <div class="sidebar">
            <h3>实时聊天</h3>
            <div class="chat-area" id="chatArea">
                <div class="chat-message">
                    <div class="message-sender">张老师</div>
                    <div>大家好，今天我们讨论细胞结构</div>
                </div>
                <div class="chat-message">
                    <div class="message-sender">李同学</div>
                    <div>老师，线粒体的功能是什么？</div>
                </div>
                <div class="chat-message">
                    <div class="message-sender">张老师</div>
                    <div>线粒体是细胞的能量工厂，负责ATP的产生</div>
                </div>
            </div>
            
            <div class="chat-input">
                <input type="text" placeholder="输入消息..." id="messageInput">
                <button class="send-btn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        let micMuted = false;
        let speakerMuted = false;

        // 麦克风控制
        document.getElementById('micBtn').addEventListener('click', function() {
            micMuted = !micMuted;
            this.classList.toggle('muted');
            this.innerHTML = micMuted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
        });

        // 扬声器控制
        document.getElementById('speakerBtn').addEventListener('click', function() {
            speakerMuted = !speakerMuted;
            this.classList.toggle('muted');
            this.innerHTML = speakerMuted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
        });

        // 发送消息
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (message) {
                const chatArea = document.getElementById('chatArea');
                const messageDiv = document.createElement('div');
                messageDiv.className = 'chat-message';
                const sender = document.createElement('div');
                sender.className = 'message-sender';
                sender.textContent = '我';
                const content = document.createElement('div');
                content.textContent = message;
                content.style.whiteSpace = 'pre-wrap';
                messageDiv.append(sender, content);
                chatArea.appendChild(messageDiv);
                chatArea.scrollTop = chatArea.scrollHeight;
                input.value = '';
            }
        }

        // 回车发送消息
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // 模拟说话状态
        setInterval(() => {
            const cards = document.querySelectorAll('.participant-card');
            cards.forEach(card => card.classList.remove('speaking'));
            
            const randomCard = cards[Math.floor(Math.random() * cards.length)];
            if (Math.random() > 0.7) {
                randomCard.classList.add('speaking');
            }
        }, 3000);
    </script>
</body>
</html>
